[project]
name = "myagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "function-schema>=0.4.5",
    "jsonschema>=4.26.0",
    "langchain-core>=1.4.0",
    "loguru>=0.7.3",
    "openai>=2.36.0",
]

[project.optional-dependencies]
scenarios = [
    "faker>=40.28.1",
    "nltk>=3.10.0",
    "numpy>=2.4.6",
    "wonderwords>=3.0.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "sympy>=1.14.0",
    "tqdm>=4.68.2",
]

[tool.setuptools.packages]
find = {}  # Scanning implicit namespaces is active by default
